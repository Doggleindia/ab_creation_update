name: Keep backend warm

# Render's free tier spins the server down after ~15 min idle, causing a slow
# (30-60s) cold start on the next request. This pings the health endpoint every
# 10 minutes so the storefront/admin never wait on a cold backend.
#
# SETUP (one time): in GitHub repo → Settings → Secrets and variables → Actions
# → Variables tab → New repository variable:
#   Name:  BACKEND_URL
#   Value: https://<your-render-service>.onrender.com   (no trailing slash)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          # Override anytime via repo variable BACKEND_URL; defaults to the
          # current Render service so this works out of the box.
          URL="${{ vars.BACKEND_URL }}"
          if [ -z "$URL" ]; then URL="https://ab-creations.onrender.com"; fi
          echo "Pinging $URL/ ..."
          curl -fsS --max-time 90 "$URL/" && echo "  ok" || echo "  ping failed (backend may be waking)"
