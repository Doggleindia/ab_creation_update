# Render Blueprint for the AB Creation backend API.
# In Render: New > Blueprint > connect this repo. It reads this file.
# Secrets (sync: false) are NOT in git — Render prompts you to paste them.
services:
  - type: web
    name: ab-creation-backend
    runtime: node
    rootDir: apps/backend
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; index.js reads process.env.PORT.
      - key: JWT_EXPIRATION
        value: 7d
      # --- paste these in the Render dashboard (kept out of git) ---
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OTP_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: AWS_ACCESS_S3_KEY_ID
        sync: false
      - key: AWS_SECRET_S3_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
