services:
  admin:
    build:
      context: .
      args:
        # Supply the backend URL at build time (Vite bakes it into the bundle).
        # Set VITE_MAIN_BACKEND in your shell or a .env file next to this.
        VITE_MAIN_BACKEND: ${VITE_MAIN_BACKEND:-}
    # The image serves the production build via nginx on port 80.
    ports:
      - "3000:80"
    restart: unless-stopped
