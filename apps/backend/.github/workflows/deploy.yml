name: Deploy to EC2 (PM2)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Node App via PM2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "📁 Move to project directory"
            cd ~/kt-adhesives-backend

            echo "🔄 Pull latest code"
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Install dependencies"
            npm install --production

            echo "♻️ Restart app with PM2"
            pm2 restart node-app || pm2 start index.js --name node-app

            echo "💾 Save PM2 process list"
            pm2 save

            echo "🌐 Reload Nginx"
            sudo systemctl reload nginx

            echo "✅ Deployment completed successfully"
